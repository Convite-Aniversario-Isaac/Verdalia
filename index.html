<style>
:root{
  --bg:#10221a;--surface:#183326;--surface2:#21422f;--line:#2f5a40;--ink:#f3ecd8;--muted:#b6c7b4;
  --gold:#f2c94c;--gold-ink:#2b1f00;--parch:#efe3c4;--parch-ink:#3a2a14;--danger:#ff6b6b;--good:#7dff9a;
  --head:"Cinzel",Georgia,serif;--font:"Alegreya Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){ --bg:#10221a;--surface:#183326;--ink:#f3ecd8; } }
:root[data-theme="light"]{ --bg:#10221a;--surface:#183326;--ink:#f3ecd8; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a5a3e 0%,var(--bg) 60%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;min-height:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:.02em}
.title{text-align:center;padding:10px 6px 4px}
.title h1{font-size:clamp(40px,11vw,68px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #6a4a0a,0 10px 30px rgba(0,0,0,.45)}
.title p{color:var(--muted);margin:8px auto 0;max-width:36ch;font-size:18px}
.lumenImg{display:block;margin:6px auto 0}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:16px;padding:14px;font-weight:800;font-size:18px;cursor:pointer}
.btn.gold{background:linear-gradient(#f6d76b,#e0b232);color:var(--gold-ink);border-color:#c99a20;box-shadow:0 5px 0 #8a6610}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.5}
.stack{display:grid;gap:10px;max-width:420px;margin:14px auto}
.note{text-align:center;color:var(--muted);font-size:15px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;cursor:pointer;font-size:20px;flex:none}
.bar h2{font-size:24px;color:var(--gold)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.hcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;cursor:pointer}
.hcard[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.hcard canvas{display:block;margin:0 auto 6px}
.hcard b{display:block;font-family:var(--head);font-size:20px}
.hcard .role{color:var(--gold);font-weight:700;font-size:14px}
.hcard p{margin:6px 0;font-size:14px;color:var(--muted)}
.stats{display:grid;gap:4px;text-align:left;font-size:13px;margin-top:6px}
.stats div{display:grid;grid-template-columns:72px 1fr;gap:6px;align-items:center}
.stats i{display:block;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.stats i i{height:100%;background:var(--gold)}
.sp b{font-family:var(--font);font-size:13px}
.sp{font-size:13px;background:var(--bg);border-radius:10px;padding:6px 8px;margin-top:8px;text-align:left}
.me{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:14px}
.me .t{flex:1;min-width:0}
.me .t b{font-family:var(--head);font-size:19px}
.me .t span{display:block;font-size:14px;color:var(--muted)}
.small{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:15px}
.path{position:relative;display:grid;gap:12px;padding-left:28px}
.path::before{content:"";position:absolute;left:12px;top:10px;bottom:10px;border-left:3px dashed var(--line)}
.chap{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer}
.chap::before{content:attr(data-n);position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--head);font-size:13px;font-weight:800}
.chap.done::before{background:#2f8a52;border-color:#7dd89a;content:"✓"}
.chap.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.chap.next::before{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chap.lock{opacity:.5;cursor:not-allowed}
.chap .t{flex:1;min-width:0}
.chap .t b{font-family:var(--head);font-size:18px;display:block}
.chap .t span{font-size:14px;color:var(--muted);display:block}
.parch .btn:not(.gold){background:#dccb9e;color:#3a2a14;border-color:#b89a5a}
.chap .go{font-weight:800;color:var(--gold);white-space:nowrap}
.info{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.info p{margin:6px 0}
.best{display:grid;gap:8px}
.best div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.best b{font-family:var(--head)}
.tag{font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.tag.a{background:#2f8a52}.tag.i{background:#8a2f3f}

/* pergaminho */
.scroll{position:fixed;inset:0;z-index:40;background:rgba(6,14,10,.86);display:grid;place-items:center;padding:14px;overflow:auto}
.parch{background:linear-gradient(#f4ead0,#e6d6ae);color:var(--parch-ink);border-radius:18px;max-width:640px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(120,80,20,.25);max-height:94vh;overflow:auto}
.parch h2{color:#5a3a10;font-size:clamp(22px,5vw,30px);text-align:center}
.parch .ch{text-align:center;font-weight:800;color:#8a6a2a;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.parch p{font-size:18px;margin:10px 0}
.parch canvas{display:block;margin:4px auto}
.parch .btn.gold{margin-top:12px}
.reward{background:rgba(255,255,255,.45);border:2px solid #c9a24a;border-radius:14px;padding:10px 12px;text-align:center;font-weight:800;margin:10px 0}

/* jogo */
.game{position:fixed;inset:0;background:#000;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels .dn{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;text-shadow:0 1px 3px #000,0 0 2px #000;white-space:nowrap}
#labels .nm{position:absolute;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:#e8ffe8;background:rgba(0,0,0,.4);padding:1px 7px;border-radius:9px;white-space:nowrap}
#labels .nm.down{color:#ffb3b3}
#labels .hpb{position:absolute;transform:translate(-50%,-50%);width:46px;height:6px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden;display:block}
#labels .hpb i{display:block;height:100%;background:#ff6b6b}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.hp{background:rgba(0,0,0,.55);border-radius:12px;padding:6px 10px;min-width:170px}
.hp b{font-size:15px}
.hp small{display:block;font-size:12px;color:#cde0cd}
.hp .bar2{height:9px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin-top:4px}
.hp .bar2 i{display:block;height:100%;background:#4cd964}
.obj{flex:1;display:flex;justify-content:center;pointer-events:none}
.obj div{background:rgba(0,0,0,.55);border-radius:12px;padding:6px 12px;display:flex;gap:10px;align-items:center;max-width:min(460px,60vw);font-weight:700;font-size:15px;color:#fff}
.arrow{width:26px;height:26px;flex:none;display:grid;place-items:center;color:var(--gold);font-size:20px;line-height:1}
.hb{border:0;background:rgba(0,0,0,.55);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;font-size:15px;color:#fff}
.banner{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(20,40,28,.82);border:1px solid rgba(242,201,76,.5);color:#fff;font-weight:700;padding:8px 14px;border-radius:12px;max-width:min(560px,86vw);text-align:center;font-size:16px;pointer-events:none}
.boss{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(340px,40vw);background:rgba(0,0,0,.6);border-radius:12px;padding:6px 10px;text-align:center;pointer-events:none}
.boss b{font-family:var(--head);color:#ffc2c2;font-size:15px}
.boss .bar2{height:10px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin-top:4px}
.boss .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#c0304a,#ff6b6b)}
.joy{position:absolute;left:0;bottom:0;width:44%;height:64%;touch-action:none}
.joy .hint{position:absolute;left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.6);font-size:14px;pointer-events:none;background:rgba(0,0,0,.3);padding:6px 10px;border-radius:10px}
.knob{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.7);pointer-events:none}
.ring{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);pointer-events:none}
.acts{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-areas:"sp sh" "bw sw";gap:10px;align-items:end;justify-items:center}
.act{border-radius:50%;border:3px solid rgba(255,255,255,.6);font-weight:800;font-size:12px;cursor:pointer;color:#fff;touch-action:none;display:grid;place-items:center;text-align:center;line-height:1.05;padding:4px;position:relative}
.act span{font-size:24px;display:block}
.act.sw{grid-area:sw;width:96px;height:96px;background:rgba(200,70,60,.88)}
.act.bw{grid-area:bw;width:78px;height:78px;background:rgba(60,150,90,.88)}
.act.sh{grid-area:sh;width:78px;height:78px;background:rgba(70,110,190,.88)}
.act.sh.on{background:rgba(242,201,76,.95);color:#2b1f00}
.act.sp{grid-area:sp;width:72px;height:72px;background:rgba(150,90,220,.9)}
.act.sp[data-cd]::after{content:attr(data-cd);position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.6);font-size:24px}
.rot{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:var(--gold);font-weight:700;font-size:14px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:9px;pointer-events:none;white-space:nowrap}
.ov{position:absolute;inset:0;background:rgba(5,15,10,.8);display:grid;place-items:center;z-index:20;padding:16px;overflow:auto}
.box{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;max-width:440px;width:100%}
.box h2{color:var(--gold);margin-bottom:6px;text-align:center}
.box p{text-align:center;color:var(--muted)}
@media (max-height:430px){ .act.sw{width:84px;height:84px}.act.bw,.act.sh{width:68px;height:68px}.act.sp{width:62px;height:62px} }
</style>

const ARENA = 58;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angTo = (a, b) => Math.atan2(b.z - a.z, b.x - a.x);
const adiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
function seeded(seed){ let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

class Game {
  constructor(ci, save, hooks){
    this.ci = ci; this.ch = CHAPTERS[ci]; this.B = BIOMES[this.ch.biome]; this.save = save; this.hooks = hooks || {};
    const H = this.H = HEROES[save.hero] || HEROES.tomas, perks = save.perks || [];
    this.maxhp = Math.round(H.hp * (perks.includes("bencao") ? 1.2 : 1));
    this.spd = H.spd * (perks.includes("pena") ? 1.15 : 1);
    this.bowMul = perks.includes("flecha") ? 1.25 : 1;
    this.swordMul = perks.includes("runa") ? 1.2 : 1; this.scdMul = perks.includes("lua") ? 0.75 : 1; this.regen = perks.includes("fenix") ? 1.5 : 0;
    this.book = this.ch.book || 0; this.diff = 1 + 0.14 * this.book; this.allyMul = 1 + 0.12 * this.book; this.items = []; this.survT = 0; this.stormT = 2; this.lavaT = 0;
    this.armorTier = save.armor || 0; this.armor = ARMOR[this.armorTier];
    this.p = { x:0, z:46, ang:-Math.PI / 2, moveAng:-Math.PI / 2, hp:this.maxhp, swordCd:0, bowCd:0, scd:0, combo:0, swing:0, swingMax:0.3,
               draw:0, block:false, inv:0, dash:0, hurt:0, spin:0, moving:false, blockFx:0 };
    this.ents = []; this.proj = []; this.zones = []; this.fx = []; this.texts = []; this.orbs = [];
    this.input = { mx:0, mz:0, sword:false, swordHeld:false, bow:false, bowHeld:false, block:false, special:false };
    this.t = 0; this.stepIdx = -1; this.state = "play"; this.banner = ""; this.bannerT = 0; this.uid = 0; this.targets = [];
    this.makeProps();
    Object.keys(HEROES).filter(h => h !== save.hero).forEach((h, i) => { const a = this.addAlly(h, [-3, 3, -5.5][i], [45, 45, 47.5][i]); a.follow = true; });
    (this.ch.allies || []).forEach((id, i) => { const a = this.addAlly(id, -6 + i * 3, 52); a.follow = true; });
    this.queue = [];
    this.nextStep();
  }
  msg(t, d){ this.banner = t; this.bannerT = d || 3; }
  pop(x, z, y, t, col){ this.texts.push({ x, z, y, t, col: col || "#fff", life:1 }); }
  burst(x, z, y, col, n, sp){ for (let i = 0; i < (n || 10); i++){ const a = rnd(0, 6.283), v = rnd(1, sp || 5); this.fx.push({ x, z, y: y || 1, vx:Math.cos(a) * v, vz:Math.sin(a) * v, vy:rnd(1, 4), life:rnd(0.35, 0.8), col }); } }
  inWater(o){ return this.B.river != null && Math.abs(o.z - this.B.river) < 3.4; }

  /* ---------- cenário ---------- */
  makeProps(){
    const B = this.B, r = seeded(this.ci * 97 + 13), avoid = [{ x:0, z:46, r:9 }, { x:0, z:0, r:9 }];
    this.ch.steps.forEach(s => {
      if (s.x != null) avoid.push({ x:s.x, z:s.z, r:8 });
      (s.targets || []).forEach(t => avoid.push({ x:t[0], z:t[1], r:7 }));
      if (s.type === "boss") avoid.push({ x:s.bx || 0, z:s.bz || -20, r:15 });
    });
    this.obst = []; this.deco = []; this.thorns = [];
    const n = Math.round(90 * B.density); let tries = 0;
    while (this.obst.length < n && tries++ < 3000){
      const a = r() * 6.283, d = Math.sqrt(r()) * (ARENA - 3), x = Math.cos(a) * d, z = Math.sin(a) * d;
      if (avoid.some(v => Math.hypot(x - v.x, z - v.z) < v.r)) continue;
      if (Math.abs(x) < 4.5 && z > -12) continue;
      if (B.river != null && Math.abs(z - B.river) < 5) continue;
      if (B.walls != null && Math.abs(z - B.walls) < 4) continue;
      if (this.obst.some(o => Math.hypot(o.x - x, o.z - z) < 3.2)) continue;
      const rock = r() < B.rocks;
      this.obst.push({ x, z, r: rock ? 1.0 : 0.6, kind: rock ? "rock" : "tree", s:0.75 + r() * 0.6, rot:r() * 6.283 });
    }
    for (let k = 0; k < 80; k++){ const a = k / 80 * 6.283, d = ARENA + 2 + r() * 4; this.deco.push({ x:Math.cos(a) * d, z:Math.sin(a) * d, s:1.1 + r() * 0.7, kind: r() < B.rocks ? "rock" : "tree", rot:r() * 6 }); }
    const nt = Math.round(30 * (B.thorns || 0));
    for (let k = 0; k < nt; k++){
      const a = r() * 6.283, d = Math.sqrt(r()) * (ARENA - 4), x = Math.cos(a) * d, z = Math.sin(a) * d;
      if (avoid.some(v => Math.hypot(x - v.x, z - v.z) < v.r) || (Math.abs(x) < 4 && z > -12)) continue;
      this.thorns.push({ x, z, s:0.6 + r() * 0.8, rot:r() * 6 });
    }
    if (B.walls != null){
      for (let x = -ARENA - 2; x <= ARENA + 2; x += 2.2) if (Math.abs(x) > 4.6) this.obst.push({ x, z:B.walls, r:1.3, kind:"wall" });
    }
  }
  collide(o, rad){
    for (const ob of this.obst){
      const dx = o.x - ob.x, dz = o.z - ob.z, d = Math.hypot(dx, dz), m = ob.r + rad;
      if (d < m && d > 0.0001){ o.x = ob.x + dx / d * m; o.z = ob.z + dz / d * m; }
    }
    const d = Math.hypot(o.x, o.z); if (d > ARENA - rad){ o.x *= (ARENA - rad) / d; o.z *= (ARENA - rad) / d; }
  }

  /* ---------- entidades ---------- */
  addAlly(id, x, z){
    const A = ALLIES[id], big = ["centauro","grifo","lumen","urso","fenix"].includes(A.type);
    const hp = Math.round(A.type === "lumen" ? A.hp : A.hp * (this.allyMul || 1)), dm = A.dmg * (A.type === "lumen" ? 1 : (this.allyMul || 1));
    const e = { id:++this.uid, side:"ally", aid:id, type:A.type, name:A.name, x, z, ang:-Math.PI / 2, hp, max:hp, spd:A.spd, dmg:dm,
                r: big ? 1.0 : 0.6, cd:rnd(0, 1), hid:A.hid, tier:this.armorTier, drawT:0, follow:false, down:false, downT:0, atkT:0, slot:this.ents.filter(q => q.side === "ally").length };
    this.ents.push(e); return e;
  }
  addFoe(type, x, z, tag){
    const F = FOES[type], hp = Math.round(F.hp * this.diff);
    const e = { id:++this.uid, side:"foe", type, model:F.model || type, ai:F.ai || type, x, z, ang:0, hp, max:hp, spd:F.spd * rnd(0.92, 1.08), dmg:F.dmg * this.diff, r:F.r, cd:rnd(0.6, 1.6), tag,
                hitT:0, stun:0, slow:0, atkT:0, vx:0, vz:0, charge:0, chargeCd:rnd(2, 5), windup:0, wind:0 };
    this.collide(e, e.r);
    this.ents.push(e); this.burst(e.x, e.z, 0.6, "#6b3f7a", 10, 3); return e;
  }
  addObj(kind, x, z, extra){
    const hp = Math.round(({ ninho:150, jaula:90, portao:420, cristal:260, selo:240, forja:300, raiz:260 }[kind] || 200) * this.diff);
    const e = Object.assign({ id:++this.uid, side:"obj", type:kind, x, z, ang:Math.PI / 2, hp, max:hp, r: kind === "portao" ? 3.4 : 1.4, hitT:0, cd:rnd(1, 3) }, extra || {});
    this.ents.push(e);
    e.ob = { x, z, r: kind === "portao" ? 3.6 : e.r * 0.8, kind:"obj" }; this.obst.push(e.ob);
    return e;
  }
  spawnBoss(id, x, z){
    const B = BOSSES[id], base = FOES[B.base] || {}, sc = B.scale || 1;
    const e = { id:++this.uid, side:"foe", boss:id, type:B.base, model:base.model || B.base, ai:B.ai || id, summon:B.summon, col:B.col, name:B.name, x, z, ang:Math.PI / 2, hp:B.hp, max:B.hp, spd:B.spd, dmg:B.dmg * (1 + 0.08 * this.book),
                r:(base.r || 1.2) * sc, scale:sc, cd:2, hitT:0, stun:0, slow:0, atkT:0, vx:0, vz:0, charge:0, windup:0, wind:0,
                t1:3, t2:7, t3:10, oa:0, armored:B.armored };
    if (id === "coracao"){ e.fixed = true; e.ob = { x, z, r:2.4, kind:"obj" }; this.obst.push(e.ob); }
    this.ents.push(e); this.boss = e; this.burst(x, z, 1.5, "#a33a5a", 40, 8);
    return e;
  }
  nearestFoe(o, max, cone, ang){
    let best = null, bd = max;
    this.ents.forEach(e => {
      if ((e.side !== "foe" && e.side !== "obj") || e.hp <= 0 || e.submerged) return;
      const d = Math.hypot(e.x - o.x, e.z - o.z) - e.r; if (d > bd) return;
      if (cone != null && Math.abs(adiff(angTo(o, e), ang)) > cone) return;
      bd = d; best = e;
    });
    return best;
  }

  /* ---------- etapas da missão ---------- */
  nextStep(){
    this.stepIdx++; this.queue = [];
    const s = this.cur = this.ch.steps[this.stepIdx];
    this.stepKills = 0; this.spawned = 0; this.spawnT = 1.5; this.target = null; this.targets = [];
    if (!s){ this.state = "win"; if (this.hooks.win) this.hooks.win(); return; }
    if (s.type === "reach"){ this.target = { x:s.x, z:s.z }; if (s.join){ const a = this.addAlly(s.join, s.x, s.z); a.waiting = true; this.waitAlly = a; } }
    if (s.type === "destroy"){ this.targets = s.targets.map(t => this.addObj(s.obj, t[0], t[1], { free:s.free, spawn:s.spawn })); this.target = this.targets[0]; }
    if (s.type === "collect"){ this.items = s.items.map(t => ({ x:t[0], z:t[1], col:s.col || "#ffe066", got:false })); }
    if (s.type === "survive"){ this.survT = s.time; }
    if (s.type === "boss"){
      this.spawnBoss(s.boss, s.bx || 0, s.bz != null ? s.bz : -20);
      this.ents.forEach(a => { if (a.side === "ally" && a.type !== "lumen"){ a.down = false; a.hp = a.max; a.waiting = false; a.follow = true; if (Math.hypot(a.x - this.p.x, a.z - this.p.z) > 10){ a.x = this.p.x + rnd(-3, 3); a.z = this.p.z + rnd(1, 4); } } });
      if (s.lumen){ const l = this.addAlly("lumen", this.p.x - 3, this.p.z + 3); l.follow = true; }
    }
    this.msg(s.text, 4);
    let at = 4;
    if (s.taunt){ this.queue.push({ t:at, m:s.taunt, d:3.5 }); at += 3.6; }
    if (s.lumen) this.queue.push({ t:at, m:"Lumen chegou para lutar ao seu lado!", d:3.5 });
    if (this.hooks.step) this.hooks.step(s, this.stepIdx);
  }
  stepCheck(){
    const s = this.cur; if (!s || this.state !== "play") return;
    if (s.type === "reach"){
      if (Math.hypot(this.p.x - s.x, this.p.z - s.z) < 4.5){
        if (this.waitAlly){ this.waitAlly.waiting = false; this.waitAlly.follow = true; this.waitAlly = null; }
        this.nextStep();
        if (this.ch.steps[this.stepIdx - 1].join) this.msg(ALLIES[this.ch.steps[this.stepIdx - 1].join].name + " se juntou a você! " + (this.cur ? this.cur.text : ""), 4);
      }
    } else if (s.type === "kill"){
      if (this.stepKills >= s.n) this.nextStep();
      else { const n = this.nearestFoe(this.p, 300); this.target = n ? { x:n.x, z:n.z } : null; }
    } else if (s.type === "destroy"){
      const left = this.targets.filter(t => t.hp > 0);
      if (!left.length) this.nextStep();
      else this.target = left.sort((a, b) => Math.hypot(a.x - this.p.x, a.z - this.p.z) - Math.hypot(b.x - this.p.x, b.z - this.p.z))[0];
    } else if (s.type === "collect"){
      this.items.forEach(it => { if (!it.got && Math.hypot(it.x - this.p.x, it.z - this.p.z) < 2.2){ it.got = true; this.burst(it.x, it.z, 1.2, it.col, 26, 5); this.pop(it.x, it.z, 2.4, "✦", it.col); } });
      const left = this.items.filter(it => !it.got);
      if (!left.length){ this.items = []; this.nextStep(); }
      else this.target = left.sort((a, b) => Math.hypot(a.x - this.p.x, a.z - this.p.z) - Math.hypot(b.x - this.p.x, b.z - this.p.z))[0];
    } else if (s.type === "survive"){
      if (this.survT <= 0){

        this.ents = this.ents.filter(e => e.side !== "foe" || e.hp > 0);
        this.proj = this.proj.filter(q => q.side !== "foe"); this.zones = [];
        this.nextStep();
      } else { const n = this.nearestFoe(this.p, 300); this.target = n ? { x:n.x, z:n.z } : null; }
    } else if (s.type === "boss"){
      if (this.boss && this.boss.hp <= 0) this.nextStep();
      else if (this.boss) this.target = this.boss;
    }
  }
  progressText(){
    const s = this.cur; if (!s) return "";
    if (s.type === "kill") return s.text + " (" + this.stepKills + "/" + s.n + ")";
    if (s.type === "collect") return s.text + " (" + (s.items.length - this.items.filter(i => !i.got).length) + "/" + s.items.length + ")";
    if (s.type === "survive") return s.text + " (" + Math.max(0, Math.ceil(this.survT)) + "s)";
    if (s.type === "destroy" && this.targets.length > 1) return s.text + " (" + this.targets.filter(t => t.hp <= 0).length + "/" + this.targets.length + ")";
    return s.text;
  }
  spawnTick(dt){
    const s = this.cur; if (!s || !s.foes || this.state !== "play") return;
    const alive = this.ents.filter(e => e.side === "foe" && e.tag === "w").length, cap = s.max || 4;
    if (alive >= cap) return;
    if (s.type === "kill" && s.n - this.stepKills - alive <= 0) return;
    if (s.type !== "kill" && s.type !== "survive" && this.spawned >= (s.trickle || 0)) return;
    this.spawnT -= dt; if (this.spawnT > 0) return;
    this.spawnT = s.type === "kill" ? 1.3 : s.type === "survive" ? (s.every || 2.5) : (s.every || 7);
    const type = s.foes[this.spawned % s.foes.length]; this.spawned++;
    let x, z, tries = 0;
    do { const a = rnd(0, 6.283), d = rnd(22, ARENA - 6); x = Math.cos(a) * d; z = Math.sin(a) * d; }
    while ((Math.hypot(x - this.p.x, z - this.p.z) < 18 || this.obst.some(o => Math.hypot(o.x - x, o.z - z) < o.r + 1.5) || (this.B.walls != null && s.type === "destroy" && z < this.B.walls)) && tries++ < 40);
    this.addFoe(type, x, z, "w");
  }

  /* ---------- herói ---------- */
  heroStep(dt){
    const p = this.p, I = this.input;
    ["swordCd","bowCd","scd","swing","draw","inv","hurt","spin","blockFx"].forEach(k => { if (p[k] > 0) p[k] = Math.max(0, p[k] - dt); });
    p.block = !!I.block && p.dash <= 0;
    let sp = this.spd * (p.block ? 0.45 : 1); if (this.inWater(p)) sp *= 0.75;
    const m = Math.hypot(I.mx, I.mz); p.moving = false;
    if (p.dash > 0){
      p.dash -= dt; p.x += Math.cos(p.ang) * 24 * dt; p.z += Math.sin(p.ang) * 24 * dt;
      this.ents.forEach(e => { if ((e.side === "foe" || e.side === "obj") && e.hp > 0 && !p.dashHit.has(e) && Math.hypot(e.x - p.x, e.z - p.z) < e.r + 1.3){ p.dashHit.add(e); this.hurt(e, 36 * this.swordMul * (1 + 0.1 * this.book)); } });
      if (Math.random() < 0.7) this.fx.push({ x:p.x, z:p.z, y:1, vx:0, vz:0, vy:0.5, life:0.35, col:"#ffd27a" });
    } else if (m > 0.12){
      const k = Math.min(1, m); p.x += I.mx / m * sp * k * dt; p.z += I.mz / m * sp * k * dt; p.moving = true; p.moveAng = Math.atan2(I.mz, I.mx);
      if (!p.block && p.swing <= 0.05 && p.draw <= 0) p.ang = p.moveAng;
    }
    if (p.block){ const n = this.nearestFoe(p, 12); if (n) p.ang = angTo(p, n); }
    this.collide(p, 0.5);
    if (I.sword || I.swordHeld){ I.sword = false; this.sword(); }
    if (I.bow || I.bowHeld){ I.bow = false; this.bow(); }
    if (I.special){ I.special = false; this.special(); }
    this.orbs.forEach(o => {
      o.t += dt;
      if (Math.hypot(o.x - p.x, o.z - p.z) < 1.7){ o.got = true; const h = Math.round(this.maxhp * 0.15); p.hp = Math.min(this.maxhp, p.hp + h); this.pop(p.x, p.z, 2.3, "+" + h, "#7dff9a"); }
    });
    this.orbs = this.orbs.filter(o => !o.got && o.t < 25);
  }
  sword(){
    const p = this.p; if (p.swordCd > 0 || p.dash > 0 || p.block) return;
    const t = this.nearestFoe(p, 3.4); if (t) p.ang = angTo(p, t);
    p.combo = (p.combo + 1) % 3; const big = p.combo === 0;
    p.swordCd = big ? 0.55 : 0.38; p.swing = p.swingMax = big ? 0.34 : 0.26;
    const dmg = this.H.sword * this.swordMul * (big ? 1.7 : 1), reach = big ? 3.1 : 2.6, arc = big ? 1.5 : 1.1;
    let hit = false;
    this.ents.forEach(e => {
      if ((e.side !== "foe" && e.side !== "obj") || e.hp <= 0 || e.submerged) return;
      const d = Math.hypot(e.x - p.x, e.z - p.z); if (d > reach + e.r) return;
      if (Math.abs(adiff(angTo(p, e), p.ang)) > arc && d > e.r + 0.6) return;
      this.hurt(e, dmg);
      if (e.side === "foe" && !e.boss){ const a = angTo(p, e); e.vx += Math.cos(a) * (big ? 12 : 6); e.vz += Math.sin(a) * (big ? 12 : 6); if (big) e.stun = 0.5; }
      hit = true;
    });
    for (let k = 0; k < 7; k++){ const a = p.ang + rnd(-arc, arc); this.fx.push({ x:p.x + Math.cos(a) * 1.7, z:p.z + Math.sin(a) * 1.7, y:1.2, vx:Math.cos(a) * 2, vz:Math.sin(a) * 2, vy:0.4, life:0.18, col: hit ? "#ffffff" : "#cfe3f0" }); }
  }
  bow(){
    const p = this.p; if (p.bowCd > 0 || p.dash > 0 || p.block) return;
    let aim = p.ang; const t = this.nearestFoe(p, 34, 0.6, p.ang); if (t) aim = angTo(p, t);

  followHero(a, dt){

const MATC = {};

function makeSword(len, glow){

    if (tier >= 3){

    }

  const bowH = makeBow(); bowH.position.set(0.72, 1.6, -0.12); bowH.visible = false; g.add(bowH); u.bowHand = bowH;
  const q = mk(Cyl(0.11, 0.09, 0.58, 6), M("#5a3a1a"), -0.38, 1.4, -0.18); q.rotation.x = 0.45; g.add(q);
  for (let k = 0; k < 3; k++){ const f = mk(Cyl(0.015, 0.015, 0.25, 4), M("#efe6d2"), -0.38, 1.75, -0.32 + k * 0.05); f.rotation.x = 0.45; g.add(f); }

    const sh = u.shield;

  if (!g.userData.anim) g.userData.anim = g.userData.kind === "quad" ? animQuad : animHuman;
  return g;
}

const TINTC = {};
function tint(g, col, k){
  const tc = new THREE.Color(col);
  g.traverse(o => {
    if (!o.isMesh || !o.material || !o.material.color) return;
    const m = o.material; if (m.emissive && m.emissiveIntensity > 0.3 && m.emissive.getHex() !== 0) return;
    const key = m.uuid + col + (k || 0.75);
    if (!TINTC[key]){ const c = m.clone(); c.color = m.color.clone().lerp(tc, k || 0.75); TINTC[key] = c; }
    o.material = TINTC[key];
  });
  return g;
}

    else if (t === "grifo") g = buildGrifo();
    else if (t === "irmao") g = buildHero(HEROES[e.hid], e.tier || 0);
    else if (t === "anao") g = buildAnao();
    else if (t === "urso") g = buildUrso();
    else if (t === "fenix") g = buildFenix();
    else g = buildLumen();
  } else if (e.side === "obj"){
    const t = e.type;

        if (e.type === "golem") [[0.1, 1.9, 0.5], [0.1, 1.9, -0.5], [-0.2, 1.6, 0]].forEach(([x, y, z]) => g.add(mk(Cone(0.15, 0.6, 5), glowM("#8fe8ff", 1.2), x, y, z)));
        if (e.type === "magma") [[0.25, 1.4, 0.2], [0.2, 1.1, -0.2], [-0.2, 1.5, 0.1]].forEach(([x, y, z]) => g.add(mk(Sph(0.12), glowM("#ff6a1a", 1.8), x, y, z, false)));
      }
    }
    else if (md === "serpente") g = buildSerpente();
    else if (md === "coracao") g = buildCoracao();
    else if (md === "aranha") g = buildAranha(sc, F.col);
    else if (md === "escorpiao") g = buildEscorpiao(sc, F.col);
    else if (md === "harpia") g = buildHarpia(e.boss === "tempestra" ? "#5a7ab8" : F.col, sc);
    else if (md === "cavaleiro") g = buildCavaleiro(F.col, sc, !!e.boss);
    else if (md === "salamandra") g = buildSalamandra(sc, F.col);
    else { g = buildMorgra(); g.scale.setScalar(sc); }
    if (e.boss && e.boss !== "garra2" && md === "harpia"){ const cr = new THREE.Group(); cr.position.set(0.05, 2.15, 0); for (let k = 0; k < 6; k++){ const a = k / 6 * 6.283; cr.add(mk(Cone(0.04, 0.22, 4), glowM(e.col || "#c8a2ff", 1.4), Math.cos(a) * 0.15, 0, Math.sin(a) * 0.15)); } g.add(cr); }
  }
  if (!g.userData.anim) g.userData.anim = g.userData.kind === "quad" ? animQuad : animHuman;
  return g;
};

function groundH(x, z){

  const r = Math.hypot(x, z); if (r > ARENA) h += (r - ARENA) * 0.35;

}

      if (!m){ const inner = buildCreature(e); m = new THREE.Group(); m.add(inner); m.userData.inner = inner; this.scene.add(m); this.models.set(e.id, m); }
      const inner = m.userData.inner;
      let y = groundH(e.x, e.z);
      if (e.type === "grifo" || e.type === "fenix") y += (e.follow ? 2.6 : 0) + Math.sin(this.t * 2 + e.id) * 0.3;
      if (e.model === "harpia") y += 1.2 * (e.scale || 1) + Math.sin(this.t * 2.5 + e.id) * 0.3;
      if (e.type === "espectro") y += 0.3 + Math.sin(this.t * 2 + e.id) * 0.2;
      if (e.type === "morgra") y += 0.5 + Math.sin(this.t * 1.5) * 0.25;
      if (e.type === "serpente") y = Math.max(y, -0.6) + (e.submerged ? -4.5 : 0);
      if (e.type === "lumen") y += Math.sin(this.t * 1.2) * 0.1;
      m.position.set(e.x, y, e.z); m.rotation.y = -(e.ang || 0);
      inner.rotation.x = e.down ? Math.PI / 2.2 : 0; inner.position.y = e.down ? 0.3 : 0;
      const atk = e.atkT > 0 ? Math.min(1, e.atkT / 0.4) : 0;
      const wind = e.windup > 0 || e.wind > 0;
      inner.userData.anim(inner, { t:this.t + e.id, moving:!!e.moving, atk: wind ? 1 : atk, cast: e.type === "morgra" && atk > 0 ? 1 : 0, draw: e.type === "centauro" ? 1 : (e.drawT > 0 ? 1 : 0), block:false, stepRate: e.charge > 0 ? 18 : 10 });

  }
  syncProj(){
    const G = this.G, seen = new Set();
    G.proj.forEach(q => {
      seen.add(q);
      let m = this.projM.get(q);

        if (q.kind === "flecha"){ m = new THREE.Group(); const sh = mk(Cyl(0.03, 0.03, 0.9, 4), M("#d8c4a0"), 0, 0, 0, false); sh.rotation.z = Math.PI / 2; m.add(sh); const tip = mk(Cone(0.06, 0.16, 4), M("#9aa3ab"), 0.5, 0, 0, false); tip.rotation.z = -Math.PI / 2; m.add(tip); }
        else if (q.kind === "pedra") m = mk(new THREE.DodecahedronGeometry(1.0, 0), M("#7d7a72"));
        else m = new THREE.Mesh(Sph(q.kind === "agua" ? 0.28 : 0.35, 8, 6), new THREE.MeshBasicMaterial({ color: q.col || "#b46bff" }));
        this.scene.add(m); this.projM.set(q, m);
      }
      m.position.set(q.x, q.kind === "pedra" ? groundH(q.x, q.z) + q.y : groundH(q.x, q.z) + q.y, q.z);
      if (q.kind === "flecha") m.rotation.y = -Math.atan2(q.vz, q.vx);
      if (q.kind === "pedra") m.rotation.x += 0.2;
    });
    this.projM.forEach((m, q) => { if (!seen.has(q)){ this.scene.remove(m); this.projM.delete(q); } });
  }
  syncZones(){
    const G = this.G, seen = new Set();
    G.zones.forEach(z => {
      seen.add(z);
      let m = this.zoneM.get(z);
      if (!m){
        m = new THREE.Group();
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 32), new THREE.MeshBasicMaterial({ color:"#ff3a3a", transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false }));
        const fill = new THREE.Mesh(new THREE.CircleGeometry(1, 32), new THREE.MeshBasicMaterial({ color:"#ff3a3a", transparent:true, opacity:0.3, side:THREE.DoubleSide, depthWrite:false }));
        ring.rotation.x = fill.rotation.x = -Math.PI / 2; m.add(ring); m.add(fill); m.userData.fill = fill;
        this.scene.add(m); this.zoneM.set(z, m);

      m.position.set(z.x, groundH(z.x, z.z) + 0.15, z.z); m.scale.setScalar(z.r);
      const k = 1 - z.t / z.max; m.userData.fill.scale.setScalar(Math.max(0.05, k));
    });
    this.zoneM.forEach((m, z) => { if (!seen.has(z)){ this.scene.remove(m); this.zoneM.delete(z); } });
  }
  syncItems(){
    const G = this.G; if (!this.itemM) this.itemM = new Map();
    const seen = new Set();
    G.items.forEach(it => {
      if (it.got) return; seen.add(it);
      let m = this.itemM.get(it);
      if (!m){
        m = new THREE.Group();
        const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), new THREE.MeshStandardMaterial({ color:it.col, emissive:it.col, emissiveIntensity:1.3, roughness:0.2, flatShading:true }));

        const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 14, 10, 1, true), new THREE.MeshBasicMaterial({ color:it.col, transparent:true, opacity:0.18, depthWrite:false, side:THREE.DoubleSide }));
        beam.position.y = 7; m.add(beam);
        this.scene.add(m); this.itemM.set(it, m);
      }
      m.position.set(it.x, groundH(it.x, it.z) + 1.1 + Math.sin(this.t * 3 + it.x) * 0.2, it.z);
      m.userData.gem.rotation.y = this.t * 2;
    });
    this.itemM.forEach((m, it) => { if (!seen.has(it)){ this.scene.remove(m); this.itemM.delete(it); } });
  }
  animFlies(dt){
    const a = this.flies.geometry.attributes.position.array, b = this.fliesBase;
    for (let k = 0; k < a.length; k += 3){ a[k] = b[k] + Math.sin(this.t * 0.7 + k) * 1.2; a[k + 1] = b[k + 1] + Math.sin(this.t * 1.3 + k * 0.5) * 0.5; a[k + 2] = b[k + 2] + Math.cos(this.t * 0.6 + k) * 1.2; }

    this.flies.material.opacity = 0.6 + Math.sin(this.t * 3) * 0.3;
  }
  syncOrbs(){
    const G = this.G, seen = new Set();
    G.orbs.forEach(o => {
      seen.add(o);
      let m = this.orbM.get(o);
      if (!m){ m = new THREE.Mesh(Sph(0.28, 8, 6), new THREE.MeshBasicMaterial({ color:"#7dff9a" })); this.scene.add(m); this.orbM.set(o, m); }

  }
  syncFX(){

    for (let k = n; k < this.MAXP; k++) pos[k * 3 + 1] = -100;

  project(x, y, z){

  }
  syncLabels(){
    const G = this.G, out = [];
    G.texts.forEach(t => { const s = this.project(t.x, groundH(t.x, t.z) + t.y + (1 - t.life) * 1.2, t.z); if (s) out.push(`<b class="dn" style="left:${s[0]}px;top:${s[1]}px;color:${t.col};opacity:${Math.min(1, t.life * 2)}">${t.t}</b>`); });

      const d = Math.hypot(e.x - G.p.x, e.z - G.p.z); if (d > 30) return;
      if (e.side === "ally"){
        if (e.type === "lumen" || d > 20) return;
        const s = this.project(e.x, groundH(e.x, e.z) + (e.type === "grifo" || e.type === "fenix" ? 5 : e.type === "centauro" || e.type === "urso" ? 3.4 : 2.7), e.z);
        if (s) out.push(`<span class="nm${e.down ? " down" : ""}" style="left:${s[0]}px;top:${s[1]}px">${e.down ? "💤 " : ""}${e.name.split(",")[0]}${e.waiting ? " ❕" : ""}</span>`);
        return;
      }
      if (e.boss || e.hp >= e.max) return;
      const h = e.side === "obj" ? (e.type === "portao" ? 8 : 3.4) : e.model === "gigante" ? 3.8 : e.model === "harpia" ? 4.0 : (e.model === "minotauro" || e.model === "cavaleiro") ? 3.0 : 2.4;
      const s = this.project(e.x, groundH(e.x, e.z) + h, e.z);
      if (s) out.push(`<i class="hpb" style="left:${s[0]}px;top:${s[1]}px"><i style="width:${Math.max(0, e.hp / e.max * 100)}%"></i></i>`);
    });
    this.labels.innerHTML = out.join("");
  }
  render(dt){
    const G = this.G, p = G.p;
    this.t += dt;
    const cv = this.r.domElement, w = cv.clientWidth, h = cv.clientHeight;
    if (w !== this.w || h !== this.h){ this.w = w; this.h = h; this.r.setSize(w, h, false); this.cam.aspect = w / h; this.cam.fov = w > h ? 58 : 72; this.cam.updateProjectionMatrix(); }
    this.syncHero(); this.syncEnts(); this.syncProj(); this.syncZones(); this.syncOrbs(); this.syncItems(); this.syncFX(); if (this.flies) this.animFlies(dt);
    if (p.moving && !p.block){ const da = adiff(p.moveAng, this.yaw); if (Math.abs(da) < 2.3) this.yaw += da * Math.min(1, dt * 1.3); }
    const gy = groundH(p.x, p.z), dist = 7.2, up = 3.8;

    want.y = Math.max(gy + up, groundH(want.x, want.z) + 1.5);
    this.camPos.lerp(want, Math.min(1, dt * 6));
    this.cam.position.copy(this.camPos);
    if (G.shake > 0) this.cam.position.add(new THREE.Vector3(rnd(-0.25, 0.25), rnd(-0.25, 0.25), rnd(-0.25, 0.25)));
    this.cam.lookAt(p.x + Math.cos(this.yaw) * 3.5, gy + 1.6, p.z + Math.sin(this.yaw) * 3.5);
    this.sun.position.set(p.x + 30, 60, p.z + 18); this.sun.target.position.set(p.x, 0, p.z);
    this.sky.position.copy(this.cam.position);
    this.clouds.children.forEach((c, k) => { c.position.x += dt * (0.8 + (k % 3) * 0.3); if (c.position.x > 140) c.position.x = -140; });
    if (this.water){ const a = this.water.geometry.attributes.position.array, b = this.waterBase; for (let k = 0; k < a.length; k += 3) a[k + 1] = Math.sin(b[k] * 0.3 + this.t * 2) * 0.08 + Math.cos(b[k + 2] * 0.8 + this.t * 1.6) * 0.06; this.water.geometry.attributes.position.needsUpdate = true; }
    this.r.render(this.scene, this.cam);
    this.syncLabels();
  }
}

  c.fillStyle = "#c9a227"; c.fillRect(94, 90, 16, 5); c.fillStyle = "#5a3416"; c.fillRect(100, 95, 4, 12);

  c.fillStyle = "#e0b232"; c.beginPath(); c.arc(25, 102, 4, 0, 7); c.fill();

  c.fillStyle = H.skin; c.beginPath(); c.ellipse(60, 52, 19, 22, 0, 0, 7); c.fill();
  c.fillStyle = H.hair; c.beginPath(); c.ellipse(60, 38, 21, 13, 0, Math.PI, 0); c.fill();
  c.beginPath(); c.ellipse(60, 36, 20, 9, 0, 0, 7); c.fill();

}
function drawLumen(cv){

  const H = HEROES[SAVE.hero];
  return `<div class="me"><div id="mp"></div><div class="t"><b>${H.name}</b><span>${H.role} · ${ARMOR[SAVE.armor].name}</span>
    <span>${SAVE.perks.length ? SAVE.perks.map(p => PERKS[p].name).join(" · ") : "Nenhum presente ainda"}</span></div>
    <button class="small" id="sw">Trocar</button></div>`;
}
function bindMe(){ $("#mp").appendChild(portrait(drawHeroPortrait, 64, HEROES[SAVE.hero], SAVE.armor)); $("#sw").onclick = pickHero; }
function map(){
  const next = CHAPTERS.findIndex((c, i) => !SAVE.done.includes(i));
  app.innerHTML = bar("A Saga de Verdália") + meCard() + `
  <div class="path">${BOOKS.map((b, k) => {
    const ch = b.chapters, n = ch.filter(i => SAVE.done.includes(i)).length, open = chOpen(ch[0]), done = n === ch.length;
    const cls = done ? "done" : (next >= 0 && ch.includes(next)) ? "next" : open ? "" : "lock";
    return `<button class="chap ${cls}" data-n="${ROMAN[k]}" data-b="${k}" ${open ? "" : "disabled"}>
      <div class="t"><b>Livro ${ROMAN[k]} — ${b.title}</b><span>${b.sub}</span><span>${n}/${ch.length} capítulos</span></div><span class="go">${open ? "Abrir ▶" : "🔒"}</span></button>`;
  }).join("")}</div>
  ${next < 0 ? `<div class="info" style="margin-top:14px"><p><b>Verdália está livre para sempre!</b> Você completou a saga inteira. Jogue de novo com outros heróis.</p></div>` : ""}`;
  bindMe(); $("#bk").onclick = home;
  app.querySelectorAll(".chap:not(.lock)").forEach(b => b.onclick = () => book(+b.dataset.b));
  scrollTo(0, 0);
}
function book(k){
  const B = BOOKS[k], next = CHAPTERS.findIndex((c, i) => !SAVE.done.includes(i));
  app.innerHTML = bar("Livro " + ROMAN[k]) + `<p class="note" style="text-align:left;margin:-4px 0 12px"><b style="font-family:var(--head);color:var(--ink);font-size:20px">${B.title}</b><br>${B.sub}</p>` + meCard() + `
  <div class="path">${B.chapters.map((i, j) => {
    const c = CHAPTERS[i], done = SAVE.done.includes(i), open = chOpen(i);
    const cls = done ? "done" : i === next ? "next" : open ? "" : "lock";
    const rw = c.reward.armor ? ARMOR[c.reward.armor].name : c.reward.perk ? PERKS[c.reward.perk].name : "";
    return `<button class="chap ${cls}" data-n="${j + 1}" data-i="${i}" ${open ? "" : "disabled"}>
      <div class="t"><b>${c.title}</b><span>${rw ? "Prêmio: " + rw : (j === B.chapters.length - 1 ? "Final do livro" : "Capítulo " + (j + 1) + " de " + B.chapters.length)}</span></div><span class="go">${done ? "Jogar de novo" : open ? "Jogar ▶" : "🔒"}</span></button>`;
  }).join("")}</div>`;
  bindMe(); $("#bk").onclick = map;
  app.querySelectorAll(".chap:not(.lock)").forEach(b => b.onclick = () => story(+b.dataset.i));
  scrollTo(0, 0);
}
function chLabel(i){ const c = CHAPTERS[i], b = c.book || 0; return "Livro " + ROMAN[b] + " · Capítulo " + (BOOKS[b].chapters.indexOf(i) + 1); }
function scroll(html, btns){
  const d = document.createElement("div"); d.className = "scroll"; d.innerHTML = `<div class="parch">${html}<div class="stack">${btns.map((b, i) => `<button class="btn ${i === 0 ? "gold" : ""}" data-k="${i}">${b[0]}</button>`).join("")}</div></div>`;
  document.body.appendChild(d);
  d.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { d.remove(); btns[+b.dataset.k][1](); });
  return d;
}
function story(i){
  const c = CHAPTERS[i];
  const b = c.book || 0, first = BOOKS[b].chapters[0] === i;
  const d = scroll(`${first ? `<div class="reward" style="margin-top:0">📖 Livro ${ROMAN[b]} — ${BOOKS[b].title}</div>` : ""}<div class="ch">${chLabel(i)}</div><h2>${c.title}</h2><div id="sl"></div>${c.intro.map(p => `<p>${esc(p)}</p>`).join("")}`,
    [["Começar capítulo", () => play(i)], ["Voltar", () => {}]]);
  d.querySelector("#sl").appendChild(portrait(drawLumen, 84));
}
function how(){
  app.innerHTML = bar("Como jogar") + `<div class="info">
    <p><b>Mover:</b> arraste o dedo no lado esquerdo da tela (ou W A S D / setas). A câmera segue você.</p>
    <p><b>⚔️ Espada:</b> golpes em sequência — o 3º golpe é mais forte e empurra os inimigos. (J ou Espaço)</p>
    <p><b>🏹 Arco:</b> atira flechas mirando sozinho no inimigo mais perto à sua frente. (L)</p>
    <p><b>🛡️ Escudo:</b> segure para se defender. Bloqueia quase todo o dano que vem da frente. (K)</p>
    <p><b>✨ Especial:</b> poder único de cada herói. Espera recarregar. (I)</p>
    <p><b>Armadura:</b> vença capítulos para ganhar armaduras melhores, que diminuem o dano recebido.</p>
    <p><b>Círculos vermelhos no chão:</b> um ataque forte vai cair ali — saia correndo!</p>
    <p><b>Orbes verdes:</b> curam um pouco da sua vida. Alguns inimigos deixam cair.</p>
    <p><b>Seta dourada:</b> no alto da tela, aponta para o seu objetivo.</p>
    <p>Dica: jogue com o celular deitado.</p></div>`;
  $("#bk").onclick = home; scrollTo(0, 0);
}
function bestiary(){
  app.innerHTML = bar("Criaturas de Verdália") + `<div class="best">${BESTIARY.map(b => `<div><b>${b[0]}</b><span class="tag ${b[2] === "aliado" ? "a" : "i"}">${b[2]}</span><br>${b[1]}</div>`).join("")}</div>`;
  $("#bk").onclick = home; scrollTo(0, 0);
}

/* ---------- jogo ---------- */
let RUN = null;
function play(ci){
  stopRun();
  layer.innerHTML = `<div class="game" id="gm">
    <canvas id="cv"></canvas><div id="labels"></div>
    <div class="hud">
      <div class="hp"><b>${HEROES[SAVE.hero].name}</b> <small>${ARMOR[SAVE.armor].name}</small><div class="bar2"><i id="hpb"></i></div></div>
      <div class="obj"><div><span class="arrow" id="arr">↑</span><span id="objt"></span></div></div>
      <button class="hb" id="pz" aria-label="Pausar">❚❚</button>
    </div>
    <div class="banner" id="ban" hidden></div>
    <div class="boss" id="bossb" hidden><b id="bossn"></b><div class="bar2"><i id="bossh"></i></div></div>
    <div class="joy" id="joy"><div class="hint">◀ arraste para andar ▶</div></div>
    <div class="acts">
      <button class="act sp" id="bSp"><span>✨</span>Especial</button>
      <button class="act sh" id="bSh"><span>🛡️</span>Escudo</button>
      <button class="act bw" id="bBw"><span>🏹</span>Arco</button>
      <button class="act sw" id="bSw"><span>⚔️</span>Espada</button>
    </div>
    <div class="rot" id="rot" hidden>Vire o celular para jogar melhor ↻</div>
  </div>`;
  const G = new Game(ci, SAVE, { win: () => setTimeout(() => winCh(ci), 1200), lose: () => setTimeout(() => loseCh(ci), 900) });
  let W;
  try { W = new World3D(G, $("#cv")); }
  catch(e){ layer.innerHTML = ""; scroll(`<h2>Ops!</h2><p>Seu aparelho não conseguiu abrir o 3D (WebGL). Tente outro navegador, como o Chrome.</p>`, [["Voltar", () => {}]]); return; }
  const R = RUN = { G, W, ci, raf:0, last:performance.now(), keys:{}, cleanup:[] };
  try { const el = document.documentElement; if (el.requestFullscreen && matchMedia("(pointer:coarse)").matches) el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {})).catch(() => {}); } catch(e){}
  setupInput(R);
  $("#pz").onclick = () => pause(R);
  const loop = now => {
    if (RUN !== R) return;
    const dt = Math.min(0.05, (now - R.last) / 1000); R.last = now;
    applyMove(R);
    G.step(dt); W.render(dt); hud(R);
    R.raf = requestAnimationFrame(loop);
  };
  R.raf = requestAnimationFrame(loop);
  window.__G = G; window.__W = W;
}
function stopRun(){
  if (!RUN) return;
  cancelAnimationFrame(RUN.raf); RUN.cleanup.forEach(f => f());
  try { RUN.W.r.dispose(); RUN.W.r.forceContextLoss && RUN.W.r.forceContextLoss(); } catch(e){}
  RUN = null; layer.innerHTML = "";
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){}
}
function setupInput(R){
  const G = R.G, I = G.input, joy = $("#joy");
  R.joy = { x:0, y:0 };
  let jid = null, ox = 0, oy = 0, knob = null, ring = null;
  joy.addEventListener("pointerdown", e => {
    if (jid !== null) return; jid = e.pointerId; ox = e.clientX; oy = e.clientY;
    try { joy.setPointerCapture(jid); } catch(_){}
    const rc = joy.getBoundingClientRect();
    ring = document.createElement("div"); ring.className = "ring"; knob = document.createElement("div"); knob.className = "knob";
    [ring, knob].forEach(n => { n.style.left = (ox - rc.left) + "px"; n.style.top = (oy - rc.top) + "px"; joy.appendChild(n); });
    const h = joy.querySelector(".hint"); if (h) h.remove();
    e.preventDefault();
  });
  joy.addEventListener("pointermove", e => {
    if (e.pointerId !== jid) return;
    let dx = e.clientX - ox, dy = e.clientY - oy; const d = Math.hypot(dx, dy), m = 55;
    if (d > m){ dx = dx / d * m; dy = dy / d * m; }
    R.joy.x = dx / m; R.joy.y = -dy / m;
    const rc = joy.getBoundingClientRect(); knob.style.left = (ox - rc.left + dx) + "px"; knob.style.top = (oy - rc.top + dy) + "px";
  });
  const end = e => { if (e.pointerId !== jid) return; jid = null; R.joy.x = R.joy.y = 0; if (knob){ knob.remove(); ring.remove(); knob = ring = null; } };
  joy.addEventListener("pointerup", end); joy.addEventListener("pointercancel", end);
  const hold = (id, on, off) => {
    const b = $(id);
    b.addEventListener("pointerdown", e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} on(); });
    ["pointerup","pointercancel","lostpointercapture"].forEach(t => b.addEventListener(t, () => off && off()));
    b.addEventListener("contextmenu", e => e.preventDefault());
  };
  hold("#bSw", () => { I.sword = true; I.swordHeld = true; }, () => I.swordHeld = false);
  hold("#bBw", () => { I.bow = true; I.bowHeld = true; }, () => I.bowHeld = false);
  hold("#bSh", () => I.block = true, () => I.block = false);
  hold("#bSp", () => I.special = true);
  const K = R.keys;
  const kd = e => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
    if (e.repeat) return;
    K[k] = true;
    if (k === "j" || k === " "){ I.sword = true; I.swordHeld = true; }
    if (k === "l"){ I.bow = true; I.bowHeld = true; }
    if (k === "k") I.block = true;
    if (k === "i") I.special = true;
    if (k === "escape" || k === "p") pause(R);
  };
  const ku = e => {
    const k = e.key.toLowerCase(); K[k] = false;
    if (k === "j" || k === " ") I.swordHeld = false;
    if (k === "l") I.bowHeld = false;
    if (k === "k") I.block = false;
  };
  const blur = () => { Object.keys(K).forEach(k => K[k] = false); I.swordHeld = I.bowHeld = I.block = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku); addEventListener("blur", blur);
  const vis = () => { if (document.hidden && G.state === "play" && !G.paused) pause(R); };
  document.addEventListener("visibilitychange", vis);
  R.cleanup.push(() => { removeEventListener("keydown", kd); removeEventListener("keyup", ku); removeEventListener("blur", blur); document.removeEventListener("visibilitychange", vis); });
}
function applyMove(R){
  const K = R.keys, I = R.G.input;
  let jx = R.joy.x, jy = R.joy.y;
  if (K.a || K.arrowleft) jx -= 1; if (K.d || K.arrowright) jx += 1;
  if (K.w || K.arrowup) jy += 1; if (K.s || K.arrowdown) jy -= 1;
  const m = Math.hypot(jx, jy); if (m > 1){ jx /= m; jy /= m; }
  const y = R.W.yaw, c = Math.cos(y), s = Math.sin(y);
  I.mx = c * jy - s * jx; I.mz = s * jy + c * jx;
}
let hudCache = {};
function setTxt(id, v){ if (hudCache[id] !== v){ hudCache[id] = v; $(id).textContent = v; } }
function hud(R){
  const G = R.G, p = G.p;
  $("#hpb").style.width = (p.hp / G.maxhp * 100) + "%";
  $("#hpb").style.background = p.hp / G.maxhp < 0.3 ? "#ff6b6b" : "#4cd964";
  setTxt("#objt", G.progressText());
  const a = $("#arr");
  if (G.target){ a.style.visibility = "visible"; const rel = Math.atan2(G.target.z - p.z, G.target.x - p.x) - R.W.yaw; a.style.transform = `rotate(${rel * 180 / Math.PI}deg)`; }
  else a.style.visibility = "hidden";
  const bn = $("#ban"); if (G.bannerT > 0 && G.banner){ bn.hidden = false; setTxt("#ban", G.banner); } else bn.hidden = true;
  const bb = $("#bossb");
  if (G.boss && G.boss.hp > 0){ bb.hidden = false; setTxt("#bossn", G.boss.name); $("#bossh").style.width = (G.boss.hp / G.boss.max * 100) + "%"; } else bb.hidden = true;
  const sp = $("#bSp"); const cd = Math.ceil(p.scd); if (cd > 0) sp.dataset.cd = cd; else delete sp.dataset.cd;
  $("#bSh").classList.toggle("on", p.block);
  $("#rot").hidden = !(innerHeight > innerWidth && matchMedia("(pointer:coarse)").matches);
}
function overlay(html, btns){
  const gm = $("#gm"); if (!gm) return;
  const o = document.createElement("div"); o.className = "ov"; o.innerHTML = `<div class="box">${html}<div class="stack">${btns.map((b, i) => `<button class="btn ${i === 0 ? "gold" : ""}" data-k="${i}">${b[0]}</button>`).join("")}</div></div>`;
  gm.appendChild(o);
  o.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { o.remove(); btns[+b.dataset.k][1](); });
}
function pause(R){
  const G = R.G; if (G.paused || G.state !== "play" || $(".ov")) return;
  G.paused = true; G.input.block = G.input.swordHeld = G.input.bowHeld = false; R.joy.x = R.joy.y = 0;
  overlay(`<h2>Pausa</h2><p>${esc(CHAPTERS[R.ci].title)}</p>`, [
    ["Continuar", () => { G.paused = false; R.last = performance.now(); }],
    ["Recomeçar capítulo", () => play(R.ci)],
    ["Sair para o mapa", () => { const b = CHAPTERS[R.ci].book || 0; stopRun(); book(b); }]
  ]);
}
function loseCh(ci){
  if (!RUN || RUN.ci !== ci) return;
  overlay(`<h2>Você caiu!</h2><p>Não desista — Verdália precisa de você. Use o escudo e fuja dos círculos vermelhos.</p>`, [
    ["Tentar de novo", () => play(ci)], ["Voltar ao mapa", () => { stopRun(); book(CHAPTERS[ci].book || 0); }]
  ]);
}
function winCh(ci){
  if (!RUN || RUN.ci !== ci) return;
  const c = CHAPTERS[ci], first = !SAVE.done.includes(ci);
  let rw = "";
  if (c.reward.armor){ if (SAVE.armor < c.reward.armor){ SAVE.armor = c.reward.armor; } rw = "Nova armadura: " + ARMOR[c.reward.armor].name + " (−" + Math.round(ARMOR[c.reward.armor].red * 100) + "% de dano)"; }
  if (c.reward.perk){ if (!SAVE.perks.includes(c.reward.perk)) SAVE.perks.push(c.reward.perk); const P = PERKS[c.reward.perk]; rw = "Presente: " + P.name + " — " + P.desc; }
  if (first) SAVE.done.push(ci);
  store(); stopRun();
  const last = ci === CHAPTERS.length - 1, bk = c.book || 0, endBook = BOOKS[bk].chapters[BOOKS[bk].chapters.length - 1] === ci;
  const btns = last ? [["Ver a saga", map], ["Tela inicial", home]]
    : [[endBook ? "Começar o Livro " + ROMAN[bk + 1] : "Próximo capítulo", () => { book(CHAPTERS[ci + 1].book || 0); story(ci + 1); }], ["Voltar", () => book(bk)]];
  const d = scroll(`<div class="ch">${chLabel(ci)} concluído</div><h2>${last ? "Verdália está livre para sempre!" : endBook ? "Livro " + ROMAN[bk] + " concluído!" : "Vitória!"}</h2><div id="sl"></div>
    ${c.outro.map(p => `<p>${esc(p)}</p>`).join("")}${rw ? `<div class="reward">🎁 ${esc(rw)}</div>` : ""}`, btns);
  d.querySelector("#sl").appendChild(last || endBook ? portrait(drawLumen, 96) : portrait(drawHeroPortrait, 84, HEROES[SAVE.hero], SAVE.armor));
  book(bk);
}
home();

</script>
